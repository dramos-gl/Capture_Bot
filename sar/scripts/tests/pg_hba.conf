# ===========================================================================
# CONFIGURACIÓN DE ACCESO CONTROLADO (PG_HBA.CONF) - SISTEMA SAR V3.0
# ===========================================================================
# Ubicación típica: C:\Program Files\PostgreSQL\<Versión>\data\pg_hba.conf
#
# Regla de Oro: Primero se valida la coincidencia de arriba hacia abajo.
# La primera regla que coincida con la conexión es la que se aplica.
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. CONEXIONES LOCALES (Servidor Central / API Local / Tareas del DBA)
# ---------------------------------------------------------------------------
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# ---------------------------------------------------------------------------
# 2. CONEXIONES REMOTAS DE ESTACIONES DE TRABAJO (SAR Desktop Clients)
# ---------------------------------------------------------------------------
# HARDENING: Solo se permite al usuario de aplicación 'sar_app_user' acceder a 'db_sar'.
# El superusuario 'postgres' tiene el acceso remoto BLOQUEADO por diseño.

# Opción A: Estación cliente específica (Ejemplo IP: 10.11.8.108)
# TYPE  DATABASE        USER            ADDRESS                 METHOD
host    db_sar          sar_app_user    10.11.8.108/32          scram-sha-256

# Opción B: Subred LAN completa para operadores (Descomentar si se usa rango dinámico)
# host    db_sar          sar_app_user    10.11.8.0/24            scram-sha-256

# ---------------------------------------------------------------------------
# 3. Nota de Seguridad para Despliegue Final (Fase 3 completa):
# ---------------------------------------------------------------------------
# Cuando todas las estaciones consuman exclusivamente el servicio SAR_API (FastAPI),
# la sección remota directa a PostgreSQL debe comentarse para lograr aislamiento total.
# ===========================================================================
