# ===========================================================================
# CONFIGURACIÓN DE ESCUCHA (POSTGRESQL.CONF) - SISTEMA SAR V2.0 (TESTING)
# ===========================================================================
# Ubicación típica: C:\Program Files\PostgreSQL\<Versión>\data\postgresql.conf
# ===========================================================================

# Habilita a PostgreSQL para escuchar peticiones en todas las interfaces de red,
# permitiendo la comunicación desde otros equipos clientes de la LAN.
listen_addresses = '*'

# Puerto estándar de escucha
port = 5432
max_connections = 100
shared_buffers = 128MB
dynamic_shared_memory_type = windows
