# ===========================================================================
# CONFIGURACIÓN DE ACCESO CONTROLADO (PG_HBA.CONF) - SISTEMA SAR V2.0
# ===========================================================================
# Ubicación típica: C:\Program Files\PostgreSQL\<Versión>\data\pg_hba.conf
#
# Regla de Oro: Primero se valida la coincidencia de arriba hacia abajo.
# La primera regla que coincida con la conexión es la que se aplica.
# ===========================================================================

# ---------------------------------------------------------------------------
# 1. CONEXIONES LOCALES (Requerido para que el Servidor y la API local funcionen)
# ---------------------------------------------------------------------------
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# ---------------------------------------------------------------------------
# 2. CONEXIONES DE PRUEBAS LOCALES (Cliente Especializado de Red)
# ---------------------------------------------------------------------------
# Permite conexión del equipo cliente 10.11.8.108 a la base de datos de producción db_sar
# TYPE  DATABASE        USER            ADDRESS                 METHOD
host    db_sar          postgres        10.11.8.108/32          scram-sha-256

# ---------------------------------------------------------------------------
